# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en, pt or es (Spanish, Mexico)
language=auto

# false leaves only the Movies and Shows tabs on the home screen (no Explore)
explore_tab=true

# Recommendation cards per hour on the home screen: 3 or 4 (the 4th is another tall card)
cards=3

# false hides the crypto prices (home screen, drawer and screensaver)
show_crypto=true

# Crypto prices: USD, BRL, EUR...
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# The home shelf: app packages, comma-separated, in order (up to 10; the rest stay in All Apps).
# Empty = the streaming apps in HomeApps.SHELF. List yours with:
#   adb shell cmd package query-activities --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER
shelf_apps=
# 2 = the shelf in two rows of shelf_columns apps each (the cards above get shorter)
shelf_rows=1
shelf_columns=7

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false
